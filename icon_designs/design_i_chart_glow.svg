<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#1E1B4B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#darkBlue)"/>
  <g filter="url(#glow)">
    <rect x="70" y="320" width="55" height="120" rx="8" fill="url(#barGrad)"/>
    <rect x="145" y="260" width="55" height="180" rx="8" fill="url(#barGrad)"/>
    <rect x="220" y="200" width="55" height="240" rx="8" fill="url(#barGrad)"/>
    <rect x="295" y="140" width="55" height="300" rx="8" fill="url(#barGrad)"/>
    <rect x="370" y="80" width="55" height="360" rx="8" fill="url(#barGrad)"/>
  </g>
  <path d="M70 380 L145 320 L220 260 L295 200 L370 140 L425 80" stroke="#FCD34D" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
</svg>
